services:
  postgres:
    container_name: fiberest-postgres
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fiberest}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fiberest}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    container_name: fiberest-app
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${PORT:-3278}:3278'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      # Compose is a production-shaped deployment: production defaults (Secure
      # cookies, JSON logs, no wildcard CORS, no implicit auto-migrate).
      # Set APP_ENV=development for local http testing, and SESSION_COOKIE_SECURE=false
      # if you terminate TLS somewhere that the app cannot see.
      APP_ENV: ${APP_ENV:-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}

volumes:
  pgdata:
