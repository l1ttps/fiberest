version: '3'

tasks:
  init:
    desc: Copy example.env to .env (if missing) and install dependencies
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists, skipping copy"
        else
          cp example.env .env && echo "Created .env from example.env"
        fi
      - go mod download
      - go mod tidy

  docs:
    desc: Generate API documentation
    cmds:
      - swag init -g cmd/server/main.go -o docs

  run:
    desc: Build docs and run server in normal mode
    deps: [docs]
    cmds:
      - go run cmd/server/main.go

  dev:
    desc: Run server in development mode with hot reload
    cmds:
      - air

  build:
    desc: Build production server binary with documentation
    deps: [docs]
    cmds:
      - go build -o bin/server cmd/server/main.go

  test:
    desc: Run all tests with race detector
    cmds:
      - go test ./... -race

  lint:
    desc: Run golangci-lint (fallback to go vet if not installed)
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run ./...
        else
          echo "golangci-lint not found, falling back to go vet"
          go vet ./...
        fi

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - go test ./... -count=1 -coverprofile=coverage.out
      - go tool cover -func=coverage.out

  docker:build:
    desc: Build docker image
    cmds:
      - docker build -t fiberest:test .

  docker:up:
    desc: Build and start compose stack
    cmds:
      - docker compose up --build -d

  docker:down:
    desc: Stop compose stack
    cmds:
      - docker compose down
